name: Deploy

# O site no ar (spec §11), no padrão do transito-analyzer: depois que a CI passa na main, monta a
# imagem (Dockerfile da raiz), publica no GHCR com as tags latest e sha-<commit>, roda
# `docker compose pull && up -d` na VPS por SSH, espera o /api/health responder pelo domínio e
# roda o smoke (apps/site/e2e/producao.spec.ts) contra o site no ar. Runbook: docs/ops/deploy.md.
#
# Ambiente `production`. Segredos: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (chave privada),
# DEPLOY_PATH (a pasta com docker-compose.yml, docker-compose.override.yml, .env e app.env).
# Variável: SITE_URL (https://<domínio>, sem barra no fim). O SITE_URL não entra na imagem: o
# site lê a origem em tempo de execução (app.env na VPS).
#
# Ações fixadas pelo commit (a tag ao lado é só para leitura).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Imagem · GHCR · compose up
    # Antes de existir a variável SITE_URL o deploy automático só pula; disparado à mão, falha avisando.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.SITE_URL != '')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write # publicar a imagem no GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: SITE_URL definida
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          case "$SITE_URL" in
            https://*) ;;
            *) echo "::error::a variável SITE_URL (https://...) não está definida"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: imagem
        env:
          REPOSITORIO: ${{ github.repository }}
        # O commit do checkout (o head do workflow_run), não o github.sha, dá nome à tag.
        run: |
          nome="ghcr.io/$(echo "$REPOSITORIO" | tr '[:upper:]' '[:lower:]')-site"
          echo "tags=$nome:latest,$nome:sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.imagem.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull e restart na VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SITE_URL: ${{ vars.SITE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_PATH,SITE_URL
          script: |
            set -eu
            # O pacote do GHCR pode ser privado: o pull usa o token deste job (expira quando o job
            # acaba) num config do Docker descartável, e o login próprio da VPS fica intacto.
            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d --remove-orphans
            for _ in $(seq 1 30); do
              if curl -fsS "$SITE_URL/api/health" >/dev/null; then
                echo saudável
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "o site não respondeu /api/health em 60 s" >&2
            docker compose logs --tail=50 app
            exit 1

  smoke:
    name: Smoke no site no ar
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @quiz/site...
      - run: pnpm --filter @quiz/site exec playwright install --with-deps chromium
      - run: pnpm --filter @quiz/site e2e:producao
        env:
          PRODUCTION_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-producao
          path: apps/site/playwright-report
          retention-days: 7
