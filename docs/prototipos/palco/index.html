<!doctype html>
<!--
  PROTÓTIPO — descartável. Responde a "Como são o mapa e a tela de Expedição (o palco do game show)"
  (https://github.com/Thyago331/quiz-your-slop/issues/14).
  Quatro variantes do mapa + Expedição sobre a Taverna do Slop, trocáveis por ?variant=A|B|C|D (padrão D, Pixel RPG),
  pela barra flutuante ou pelas setas ← →. Estado só em memória: recarregar reinicia.
  Rodar: xdg-open docs/prototipos/palco/index.html
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTÓTIPO — Palco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121a; --panel: #1e1b27; --panel2: #282436; --text: #ece8f4; --muted: #9a93ad;
    --line: #3a3550; --gold: #f2c14e; --ok: #4fd18b; --bad: #ff6b6b; --fog: #4a4560;
    --stale: #ff9f43; --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 8px; padding: 8px 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #140f22; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  pre { background: #0d0b12; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 ui-monospace, monospace; margin: 6px 0; }
  code { font-family: ui-monospace, monospace; font-size: .92em; }
  textarea { width: 100%; min-height: 70px; background: #0d0b12; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .gold { color: var(--gold); }
  .opt { display: block; width: 100%; text-align: left; margin: 6px 0; }
  .opt.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .opt.right { border-color: var(--ok); } .opt.wrong { border-color: var(--bad); }
  .step-fog { color: var(--muted); font-style: italic; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #1a1405; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 50; animation: pop .5s ease; }
  @keyframes pop { from { transform: translate(-50%, -20px) scale(.8); opacity: 0; } }
  @keyframes glow { 0%,100% { filter: drop-shadow(0 0 0 var(--gold)); } 50% { filter: drop-shadow(0 0 10px var(--gold)); } }
  .new { animation: glow 1.2s ease 3; }

  /* Barra do protótipo: propositalmente fora do design avaliado */
  #proto-bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 6px; align-items: center;
    background: #fff; color: #111; border-radius: 999px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5); font: 13px system-ui; }
  #proto-bar button { background: #111; color: #fff; border: 0; border-radius: 999px; padding: 4px 10px; }
  #proto-bar span { padding: 0 8px; font-weight: 600; white-space: nowrap; }

  /* ---------- Variante A: Mapa-mundi ---------- */
  .A-hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; gap: 8px; }
  .A-xpbar { width: 180px; height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .A-xpbar i { display: block; height: 100%; background: var(--gold); }
  .A-world { padding: 16px; }
  .A-world svg { width: 100%; height: auto; max-height: calc(100vh - 150px); display: block; }
  .A-modal-back { position: fixed; inset: 0; background: rgba(8,6,12,.72); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .A-modal { width: min(720px, 100%); max-height: calc(100vh - 90px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .A-pips { display: flex; gap: 6px; margin-bottom: 12px; }
  .A-pips i { flex: 1; height: 6px; border-radius: 9px; background: var(--panel2); }
  .A-pips i.ok { background: var(--ok); } .A-pips i.bad { background: var(--bad); } .A-pips i.null { background: var(--gold); } .A-pips i.cur { background: var(--accent); }

  /* ---------- Variante B: Palco de game show ---------- */
  .B { min-height: 100vh; display: grid; grid-template-columns: 1fr 260px; background: radial-gradient(ellipse at top, #2c1f4a 0%, var(--bg) 60%); }
  .B-stage { padding: 28px 32px 90px; display: flex; flex-direction: column; align-items: center; }
  .B-lights { display: flex; gap: 14px; margin: 10px 0 26px; }
  .B-lights i { width: 34px; height: 34px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-weight: 700; }
  .B-lights i.ok { background: var(--ok); color: #062; } .B-lights i.bad { background: var(--bad); color: #400; } .B-lights i.null { background: var(--gold); color: #430; } .B-lights i.cur { border-color: var(--gold); box-shadow: 0 0 14px var(--gold); }
  .B-q { font-size: 26px; font-weight: 700; text-align: center; max-width: 780px; margin: 0 0 22px; }
  .B-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(820px, 100%); }
  .B-answers .opt { margin: 0; padding: 16px; font-size: 16px; border-radius: 40px; background: #1b1530; }
  .B-answers .opt b { color: var(--gold); margin-right: 8px; }
  .B-panel { width: min(820px, 100%); margin-top: 18px; background: rgba(30,27,39,.85); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .B-side { border-left: 1px solid var(--line); background: rgba(20,18,26,.9); padding: 18px 14px 90px; }
  .B-mini h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .B-chip { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 6px 10px; font-size: 13px; }
  .B-host { text-align: center; color: var(--muted); font-style: italic; margin-bottom: 4px; }
  .B-big { font-size: 64px; font-weight: 800; color: var(--gold); text-align: center; margin: 10px 0; }

  /* ---------- Variante C: Editor (IDE) ---------- */
  .C { display: grid; grid-template-columns: 250px 1fr 380px; height: 100vh; }
  .C > div { overflow-y: auto; }
  .C-tree { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 0 80px; font-size: 13px; }
  .C-tree h4 { margin: 12px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .C-node { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 0; padding: 3px 14px; color: var(--text); font: 13px ui-monospace, monospace; }
  .C-node:hover { background: var(--panel2); }
  .C-node.fog { filter: blur(2.5px); color: var(--muted); pointer-events: none; user-select: none; }
  .C-node.cur { background: var(--panel2); box-shadow: 2px 0 0 var(--accent) inset; }
  .C-code { background: #0d0b12; padding: 0 0 80px; }
  .C-tab { padding: 8px 14px; border-bottom: 1px solid var(--line); font: 13px ui-monospace, monospace; color: var(--muted); background: var(--panel); }
  .C-code table { border-collapse: collapse; font: 13px/1.6 ui-monospace, monospace; width: 100%; }
  .C-code td.n { color: var(--fog); text-align: right; padding: 0 12px; user-select: none; width: 1%; }
  .C-code td.c { white-space: pre; padding-right: 16px; }
  .C-code tr.hl td { background: rgba(242,193,78,.12); }
  .C-quest { background: var(--panel); border-left: 1px solid var(--line); padding: 16px 16px 90px; }
  .C-status { font: 12px ui-monospace, monospace; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; }

  @media (max-width: 900px) {
    .B { grid-template-columns: 1fr; } .B-side { border-left: 0; border-top: 1px solid var(--line); }
    .B-answers { grid-template-columns: 1fr; }
    .C { grid-template-columns: 1fr; height: auto; } .C > div { overflow: visible; }
  }
  /* ---------- Variante D: Pixel RPG ---------- */
  .D { min-height: 100vh; background: #10101c; font-family: 'VT323', ui-monospace, monospace; font-size: 22px; line-height: 1.15; color: #f4f0e8; padding: 14px 14px 80px; image-rendering: pixelated; }
  .D h1, .D h2, .D .px { font-family: 'Press Start 2P', ui-monospace, monospace; font-weight: 400; letter-spacing: 0; }
  .D h2 { font-size: 16px; line-height: 1.6; margin: 0 0 10px; }
  .D-win { background: linear-gradient(#2b3a8f, #141b4d); border-radius: 2px; padding: 14px 16px; margin: 8px;
    box-shadow: 0 0 0 4px #f4f0e8, 0 0 0 8px #10101c, 0 0 0 10px #6b74c9; }
  .D-hud { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; }
  .D-bar { display: inline-flex; gap: 2px; vertical-align: middle; }
  .D-bar i { width: 10px; height: 14px; background: #2a2a44; display: inline-block; }
  .D-bar i.on { background: #f1c40f; } .D-bar.hp i.on { background: #e74c3c; }
  .D-map { margin: 18px 8px 8px; }
  .D-map svg { width: 100%; height: auto; display: block; max-height: calc(100vh - 210px); }
  .D-map g[data-reg] { cursor: pointer; }
  .D-btn { font-family: 'VT323', ui-monospace, monospace; font-size: 22px; background: none; border: 0; color: #f4f0e8; padding: 2px 6px 2px 26px; display: block; width: 100%; text-align: left; position: relative; border-radius: 0; }
  .D-btn:hover, .D-btn.sel { color: #f1c40f; }
  .D-btn.sel::before, .D-btn:hover::before { content: '▶'; position: absolute; left: 4px; animation: blink .8s steps(1) infinite; }
  .D-btn.right { color: #4fd18b; } .D-btn.wrong { color: #ff6b6b; text-decoration: line-through; }
  .D-btn:disabled { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes hit { 0%,100% { transform: none; filter: none; } 25% { transform: translateX(-8px); filter: brightness(3); } 75% { transform: translateX(8px); } }
  .D-battle { display: grid; grid-template-rows: auto auto; align-content: start; }
  .D-arena { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 0 8px;
    background: repeating-linear-gradient(0deg, #1b2a1f 0 24px, #1f3123 24px 48px); margin: 8px; box-shadow: 0 0 0 4px #10101c; }
  .D-arena svg.mon { width: 168px; height: 140px; animation: bob 1.2s steps(2) infinite; }
  .D-arena svg.mon.hit { animation: hit .4s steps(4) 2; }
  .D-code { background: #0a0a12; color: #c9f7c9; font: 15px/1.5 ui-monospace, monospace; padding: 10px; margin: 6px 0; overflow-x: auto; white-space: pre; box-shadow: 0 0 0 3px #f4f0e8; }
  .D code { font-family: ui-monospace, monospace; font-size: 17px; color: #7fdbff; }
  .D textarea { font-family: 'VT323', monospace; font-size: 20px; background: #0a0a12; box-shadow: 0 0 0 3px #f4f0e8; border: 0; border-radius: 0; }
  .D-step-fog { color: #9aa0b0; }
  .D-big { font-family: 'Press Start 2P', monospace; font-size: 28px; color: #f1c40f; text-align: center; margin: 8px 0 16px; text-shadow: 4px 4px 0 #8a5a00; }
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-bar"><button id="prev">←</button><span id="label"></span><button id="next">→</button></div>
<script>
// ---------------- Dados da Taverna (esboço aprovado em #13) ----------------
const TERRITORIOS = [
  { id: 'salao', nome: 'Salão', pasta: 'web/' },
  { id: 'balcao', nome: 'Balcão', pasta: 'api/ + shared/' },
  { id: 'adega', nome: 'Adega', pasta: 'db/' },
  { id: 'cozinha', nome: 'Cozinha', pasta: 'kitchen/' },
];
const REGIOES = [
  { id: 'cardapio', nome: 'Cardápio', t: 'salao', x: 130, y: 120, arquivos: ['web/src/pages/Menu.tsx', 'web/src/api/items.ts'] },
  { id: 'checkout', nome: 'Carrinho e Checkout', t: 'salao', x: 130, y: 320, arquivos: ['web/src/cart/useCart.ts', 'web/src/pages/Checkout.tsx'] },
  { id: 'api', nome: 'API de Pedidos', t: 'balcao', x: 440, y: 150, arquivos: ['api/src/routes/orders.ts', 'api/src/orders/service.ts', 'api/src/orders/coupons.ts'] },
  { id: 'cofre', nome: 'Cofre do Anão', t: 'balcao', x: 570, y: 330, arquivos: ['api/src/payments/dwarfVault.ts'] },
  { id: 'grimorio', nome: 'Grimório', t: 'balcao', x: 400, y: 360, arquivos: ['shared/money.ts', 'shared/types.ts'] },
  { id: 'livro', nome: 'Livro de Registros', t: 'adega', x: 800, y: 130, arquivos: ['db/schema.sql', 'api/src/db/ordersRepo.ts'] },
  { id: 'fogao', nome: 'Fogão', t: 'cozinha', x: 800, y: 350, arquivos: ['kitchen/src/worker.ts', 'kitchen/src/queue.ts'] },
];
const LIGACOES = [
  { de: 'cardapio', para: 'api', tipo: 'Chamada', d: 'GET /items' },
  { de: 'checkout', para: 'api', tipo: 'Chamada', d: 'POST /orders' },
  { de: 'cardapio', para: 'grimorio', tipo: 'Dependência', d: 'formatGold' },
  { de: 'api', para: 'cofre', tipo: 'Dependência', d: 'charge()' },
  { de: 'api', para: 'livro', tipo: 'Consulta', d: 'INSERT INTO orders' },
  { de: 'api', para: 'fogao', tipo: 'Evento', d: 'order.paid' },
  { de: 'api', para: 'grimorio', tipo: 'Dependência', d: 'formatGold' },
  { de: 'fogao', para: 'livro', tipo: 'Consulta', d: 'UPDATE orders' },
];
const CODIGO = {
  'api/src/routes/orders.ts': `import { Router } from 'express';
import { validateOrder } from '../orders/service';
import { charge } from '../payments/dwarfVault';
import { ordersRepo } from '../db/ordersRepo';
import { publish } from '../queue';

export const orders = Router();

orders.post('/orders', async (req, res) => {
  const order = validateOrder(req.body);
  const receipt = await charge(order.id, order.total);
  if (!receipt.approved) return res.status(402).json({ error: 'not enough gold' });
  await ordersRepo.insert({ ...order, status: 'paid' });
  await publish('order.paid', { orderId: order.id });
  res.status(201).json({ id: order.id, total: order.total });
});`,
  'api/src/orders/service.ts': `import { Order, OrderInput } from '../../../shared/types';

const KINGS_TAX = 0.07;

// Validates the order input.
export function validateOrder(input: OrderInput): Order {
  if (!input.items?.length) throw new Error('empty order');
  const subtotal = input.items.reduce(
    (sum, it) => sum + it.price * it.qty, 0);
  // the king takes his share
  const total = subtotal * (1 + KINGS_TAX);
  input.status = 'validated';
  return { ...input, id: crypto.randomUUID(), total };
}`,
  'api/src/orders/coupons.ts': `// TODO: remove after the tavern festival
export function applyCoupon(total: number, code: string) {
  return code === 'FESTIVAL' ? total * 0.9 : total;
}`,
  'api/src/payments/dwarfVault.ts': `// Dwarf Vault — fake payment provider.
// charge() is idempotent: paying twice for the same order
// never double-charges.
export async function charge(orderId: string, amount: number) {
  const approved = amount <= 500;
  ledger.push({ orderId, amount, at: Date.now() });
  return { approved, ref: 'DV-' + ledger.length };
}

const ledger: { orderId: string; amount: number; at: number }[] = [];`,
  'web/src/cart/useCart.ts': `import { useState } from 'react';

export function useCart() {
  const [items, setItems] = useState<CartItem[]>([]);
  const subtotal = items.reduce((s, it) => s + it.price * it.qty, 0);
  // show a friendly round number
  const total = Math.ceil(subtotal * 1.07);
  return { items, setItems, total };
}`,
  'shared/money.ts': `export const formatGold = (n: number) =>
  \`\${n.toFixed(2)} 🪙\`;`,
};

const DESAFIOS = [
  { formato: 'Múltipla escolha', dif: 1, q: 'Quando `POST /orders` chega, qual é a primeira função de negócio chamada?',
    opts: ['charge()', 'validateOrder()', 'ordersRepo.insert()', 'publish()'], gab: 1,
    exp: 'O handler chama `validateOrder(req.body)` antes de qualquer cobrança ou gravação.',
    ev: ['api/src/routes/orders.ts', 10, 10] },
  { formato: 'Apontar no código', dif: 2, q: 'Em qual função o "imposto do rei" é aplicado?',
    opts: ['routes/orders.ts → orders.post', 'orders/service.ts → validateOrder', 'orders/coupons.ts → applyCoupon', 'shared/money.ts → formatGold'], gab: 1,
    exp: 'Apesar do nome, `validateOrder()` também calcula o total com `KINGS_TAX` — e ainda muta o `input`. Nome enganoso clássico.',
    ev: ['api/src/orders/service.ts', 7, 13] },
  { formato: 'Traçar o fluxo', dif: 3, q: 'Ordene o que acontece depois que `POST /orders` chega à API:',
    steps: [
      { t: 'validateOrder() calcula o total', ok: 0 },
      { t: 'charge() cobra no Cofre do Anão', ok: 1 },
      { t: '??? (Consulta → região desconhecida)', fog: true, ok: 2 },
      { t: '??? (Evento → região desconhecida)', fog: true, ok: 3 },
    ],
    exp: 'Validar → cobrar → gravar o pedido como `paid` → publicar `order.paid`. As duas últimas etapas saem da região: revele-a para ver para onde vão.',
    ev: ['api/src/routes/orders.ts', 9, 15] },
  { formato: 'Múltipla escolha', dif: 4, isca: true, q: 'O que acontece se o cliente clicar em Pagar duas vezes para o mesmo pedido?',
    opts: ['A segunda cobrança é recusada com 409', 'Nada: charge() é idempotente', 'O pedido é cobrado duas vezes', 'O Fogão cancela o pedido duplicado'], gab: 1,
    exp: 'Segundo o comentário do Cofre do Anão, `charge()` é idempotente.',
    ev: ['api/src/payments/dwarfVault.ts', 2, 3],
    contestacao: 'Você tem razão: nenhuma linha de `charge()` verifica se o `orderId` já foi cobrado — ela só faz `ledger.push`. O comentário mente. Desafio anulado.' },
  { formato: 'Múltipla escolha', dif: 5, q: 'O total que a API cobra é igual ao que o carrinho mostra?',
    opts: ['Sim, os dois usam formatGold()', 'Sim, o front lê o total da API', 'Não: o front arredonda para cima, a API não', 'Não: a API aplica cupom e o front não'], gab: 2,
    exp: 'O carrinho faz `Math.ceil(subtotal * 1.07)`; a API faz `subtotal * (1 + KINGS_TAX)` sem arredondar. O cliente vê um preço e paga outro.',
    ev: ['web/src/cart/useCart.ts', 6, 7] },
];
const TITULOS = [[0, 'Comitador Cego'], [100, 'Leitor de Diff'], [300, 'Arqueólogo de Código'], [600, 'Unslopper']];

// ---------------- Estado (só em memória) ----------------
const S = {
  variant: new URLSearchParams(location.search).get('variant') || 'D',
  xp: 80,
  estado: { cardapio: 'revelada', checkout: 'desbloqueada', api: 'desbloqueada', grimorio: 'desatualizada', cofre: 'nevoa', livro: 'nevoa', fogao: 'nevoa' },
  ligConhecidas: new Set([0, 2]),     // ligações das regiões já reveladas (Cardápio)
  exp: null,                          // Expedição em andamento
  novas: [], toast: null, arquivo: 'api/src/routes/orders.ts', hl: null,
};
const titulo = xp => TITULOS.filter(([min]) => xp >= min).pop()[1];
const proxTitulo = xp => TITULOS.find(([min]) => xp < min);
const reg = id => REGIOES.find(r => r.id === id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/`([^`]+)`/g, '<code>$1</code>');
const progresso = () => { const k = Object.values(S.estado).filter(e => e !== 'nevoa'); return Math.round(100 * k.filter(e => e === 'revelada').length / k.length); };

function iniciarExpedicao(id) {
  if (S.estado[id] === 'nevoa') return;
  if (S.variant === 'D' && S.estado[id] === 'desatualizada') { S.modal = id; render(); return; }
  if (S.variant === 'D' && S.estado[id] === 'revelada') { flash(reg(id).nome + ' já está revelada ★'); return; }
  if (id !== 'api') { flash('No protótipo só a API de Pedidos tem Desafios'); return; }
  S.exp = { regiao: id, i: 0, res: [], sel: null, flow: [], fase: 'responder', contestando: false, contestado: {} };
  render();
}
function responder() {
  const e = S.exp, d = DESAFIOS[e.i];
  const certo = d.steps ? e.flow.every((s, k) => d.steps[s].ok === k) : e.sel === d.gab;
  e.res[e.i] = certo ? 'ok' : 'bad'; e.fase = 'feedback';
  S.hl = d.ev; S.arquivo = d.ev[0];
  render();
}
function contestar(texto) {
  const e = S.exp, d = DESAFIOS[e.i];
  if (d.isca) { e.res[e.i] = 'null'; e.contestado[e.i] = d.contestacao; S.xp += 50; flash('🏹 Caçador de Slop! +50 XP'); }
  else e.contestado[e.i] = 'Gabarito mantido: a Evidência mostra exatamente essa linha. Releia o trecho destacado.';
  e.contestando = false; render();
}
function proximo() {
  const e = S.exp;
  if (e.i < DESAFIOS.length - 1) { e.i++; e.sel = null; e.flow = []; e.fase = 'responder'; S.hl = null; }
  else {
    e.fase = 'resumo';
    const acertos = e.res.filter(r => r === 'ok' || r === 'null').length;
    const antes = titulo(S.xp);
    S.xp += acertos * 20;
    e.acertos = acertos; e.venceu = acertos >= 4;
    if (e.venceu) {
      S.estado.api = 'revelada';
      S.novas = [];
      LIGACOES.forEach((l, k) => { if (l.de === 'api' || l.para === 'api') { S.ligConhecidas.add(k);
        const viz = l.de === 'api' ? l.para : l.de; if (S.estado[viz] === 'nevoa') { S.estado[viz] = 'desbloqueada'; S.novas.push(viz); } } });
    }
    if (titulo(S.xp) !== antes) setTimeout(() => flash('⬆ Novo Título: ' + titulo(S.xp)), 900);
  }
  render();
}
function sair() { S.exp = null; S.hl = null; render(); }
function flash(t) { S.toast = t; render(); setTimeout(() => { S.toast = null; render(); }, 2200); }

// ---------------- Peças pequenas reaproveitadas ----------------
function evidenciaHTML(ev) {
  const [arq, a, b] = ev; const linhas = (CODIGO[arq] || '').split('\n').slice(a - 1, b).join('\n');
  return `<div class="muted" style="margin-top:8px">Evidência: <code>${arq}:${a}${b > a ? '-' + b : ''}</code></div><pre>${linhas.replace(/</g, '&lt;')}</pre>`;
}
function entradaHTML(d, e, estilo) {
  if (d.steps) {
    const restantes = d.steps.map((s, k) => k).filter(k => !e.flow.includes(k));
    return `<div class="muted">Clique nos passos na ordem certa:</div>
      <ol>${e.flow.map(k => `<li class="${d.steps[k].fog ? 'step-fog' : ''}">${esc(d.steps[k].t)}</li>`).join('')}</ol>
      ${restantes.map(k => `<button class="opt ${d.steps[k].fog ? 'step-fog' : ''}" data-step="${k}">${esc(d.steps[k].t)}</button>`).join('')}
      ${e.flow.length ? '<button data-act="limpar">Recomeçar a ordem</button>' : ''}`;
  }
  return d.opts.map((o, k) => {
    let c = 'opt'; if (e.sel === k) c += ' sel';
    if (e.fase === 'feedback') { if (k === d.gab) c += ' right'; else if (e.sel === k) c += ' wrong'; }
    const letra = estilo === 'show' ? `<b>${'ABCD'[k]}</b>` : '';
    return `<button class="${c}" data-opt="${k}" ${e.fase !== 'responder' ? 'disabled' : ''}>${letra}${esc(o)}</button>`;
  }).join('');
}
function feedbackHTML(d, e) {
  const r = e.res[e.i];
  const head = r === 'ok' ? '<b class="ok">✔ Acertou</b>' : r === 'null' ? '<b class="gold">⚑ Desafio anulado</b>' : '<b class="bad">✘ Errou</b>';
  return `${head}<p>${esc(d.exp)}</p>${evidenciaHTML(d.ev)}
    ${e.contestado[e.i] ? `<p class="${r === 'null' ? 'gold' : 'muted'}">${esc(e.contestado[e.i])}</p>` : ''}
    ${e.contestando ? `<textarea id="arg" placeholder="Por que o gabarito está errado?"></textarea><button data-act="enviarcont">Enviar Contestação</button>`
      : ''}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${!e.contestado[e.i] && !e.contestando ? '<button data-act="contestar">⚑ Contestar gabarito</button>' : ''}
      <button class="primary" data-act="proximo">${e.i < DESAFIOS.length - 1 ? 'Próximo Desafio' : 'Ver resultado'}</button>
    </div>`;
}
function resumoHTML(e) {
  return `<p>${e.acertos} de 5 — ${e.venceu ? '<b class="ok">API de Pedidos revelada!</b>' : '<b class="bad">Região continua desbloqueada</b>'}</p>
    <p>+${e.acertos * 20} XP ${e.contestado[3] && e.res[3] === 'null' ? '· +50 XP Caçador de Slop' : ''}</p>
    ${e.venceu ? `<p>A Névoa recua: ${S.novas.map(id => `<b class="gold">${reg(id).nome}</b>`).join(', ')} agora estão desbloqueadas.</p>` : ''}
    <p class="muted">Arquivos citados: ${[...new Set(DESAFIOS.map(d => d.ev[0]))].map(a => `<code>${a}</code>`).join(' ')}</p>
    <button class="primary" data-act="sair">Voltar ao mapa</button>`;
}

// ---------------- Variante D: Pixel RPG ----------------
const PAL = { k: '#1a1020', w: '#f4f0e8', r: '#c0392b', R: '#7b1f16', o: '#e67e22', y: '#f1c40f', g: '#5ac54f', G: '#2f7d32', b: '#3b7dd8',
  B: '#1b3f73', n: '#a0683a', N: '#5d3a1a', s: '#b7c0c7', S: '#6b7783', p: '#9b59b6', P: '#5b2c6f', c: '#7fdbff' };
const SPR = {
  cardapio: ['.nwwwwn.', '.wkkkkw.', '.wwwwww.', '.wkkkww.', '.wwwwww.', '.wkkkkw.', '.nwwwwn.', '........'],
  checkout: ['........', 'k.......', '.kyyyyy.', '.kyoyoy.', '.kyyyyy.', '.kkkkkk.', '..kk.kk.', '........'],
  api:      ['s.s..s.s', 'ssssssss', '.sSSSSs.', '.ssssss.', '.ssbbss.', '.ssssss.', '.ssNNss.', 'ssssssss'],
  cofre:    ['........', '.NNNNNN.', 'NnnnnnnN', 'NNNyyNNN', 'NnnyynnN', 'NnnnnnnN', 'NNNNNNNN', '........'],
  grimorio: ['........', '.pppppp.', '.pwwwwp.', '.pPPPPp.', '.pwwwwp.', '.pppppp.', '.kkkkkk.', '........'],
  livro:    ['........', '.nnnnnn.', '.nwwwwn.', '.nNNNNn.', '.nwwwwn.', '.nnnnnn.', '.kkkkkk.', '........'],
  fogao:    ['...o....', '..oyo.o.', '.oyyyoo.', '.oyyyyo.', 'kkkkkkkk', '.kSSSSk.', '.kSSSSk.', '..kkkk..'],
  heroi:    ['..yyyy..', '..ywwy..', '..wwww..', '.bbbbbb.', 'w.bbbb.w', '..bbbb..', '..b..b..', '.NN..NN.'],
  slime:    ['....gggg....', '..gggggggg..', '.gggggggggg.', '.ggwkggwkgg.', 'gggwkggwkggg', 'gggggggggggg',
             'ggggkkkkgggg', 'gGggggggggGg', 'GGGGGGGGGGGG', '.GGGGGGGGGG.'],
};
const sprite = (rows, x, y, px) => rows.map((row, j) => [...row].map((ch, i) => PAL[ch]
  ? `<rect x="${x + i * px}" y="${y + j * px}" width="${px}" height="${px}" fill="${PAL[ch]}"/>` : '').join('')).join('');
const T = 24, COLS = 32, ROWS = 18;
const ILHAS = { salao: [1, 2, 8, 14], balcao: [11, 1, 10, 16], adega: [23, 1, 8, 7], cozinha: [23, 10, 8, 7] };
const POS = { cardapio: [4, 5], checkout: [4, 12], api: [15, 4], cofre: [18, 12], grimorio: [13, 12], livro: [26, 3], fogao: [26, 13] };
const hash = (i, j) => ((i * 73856093) ^ (j * 19349663)) % 7;
function ehTerra(i, j) { return Object.values(ILHAS).some(([x, y, w, h]) => i >= x && i < x + w && j >= y && j < y + h); }

function mapaPixel() {
  let s = '';
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const x = i * T, y = j * T, terra = ehTerra(i, j);
    s += `<rect x="${x}" y="${y}" width="${T}" height="${T}" fill="${terra ? '#3e8948' : '#2a5f9e'}"/>`;
    if (terra && hash(i, j) === 0) s += `<rect x="${x + 6}" y="${y + 9}" width="3" height="3" fill="#2f6d38"/><rect x="${x + 15}" y="${y + 15}" width="3" height="3" fill="#2f6d38"/>`;
    if (!terra && hash(i, j) < 2) s += `<rect x="${x + 4}" y="${y + 10}" width="9" height="3" fill="#3f7fc7"/>`;
  }
  // estradas (Ligações conhecidas): horizontal e depois vertical, pontes sobre a água
  const rotulos = [], usados = [];
  [...S.ligConhecidas].forEach(k => {
    const l = LIGACOES[k], [ax, ay] = POS[l.de], [bx, by] = POS[l.para];
    const tiles = [];
    for (let i = Math.min(ax, bx); i <= Math.max(ax, bx); i++) tiles.push([i, ay]);
    for (let j = Math.min(ay, by); j <= Math.max(ay, by); j++) tiles.push([bx, j]);
    tiles.forEach(([i, j]) => {
      const ponte = !ehTerra(i, j);
      s += `<rect x="${i * T + 6}" y="${j * T + 6}" width="12" height="12" fill="${ponte ? '#8a5a2b' : '#c8a165'}"/>`;
      if (ponte) s += `<rect x="${i * T + 6}" y="${j * T + 11}" width="12" height="2" fill="#5d3a1a"/>`;
    });
    const traco = { Chamada: '#f4f0e8', Consulta: '#7fdbff', Evento: '#f1c40f', 'Dependência': '#c39bd3' }[l.tipo];
    let [li, lj] = tiles[Math.floor(tiles.length / 2)], ly = lj * T + 4;
    while (usados.some(([ux, uy]) => Math.abs(ux - li * T) < 150 && Math.abs(uy - ly) < 18)) ly += 18;
    usados.push([li * T, ly]);
    rotulos.push(`<text x="${li * T + 12}" y="${ly}" fill="${traco}" font-family="VT323" font-size="17" text-anchor="middle" stroke="#10101c" stroke-width="3" paint-order="stroke">${l.tipo}: ${l.d}</text>`);
  });
  // construções, Névoa e herói
  REGIOES.forEach(r => {
    const [i, j] = POS[r.id], x = i * T - 12, y = j * T - 12, e = S.estado[r.id];
    if (e === 'nevoa') {
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let q = 0; q < 6; q++) for (let w = 0; w < 6; w++)
        if ((q + w) % 2 === 0) s += `<rect x="${(i + a) * T + q * 4}" y="${(j + b) * T + w * 4}" width="4" height="4" fill="#d6d9e0" opacity=".85"/>`;
      s += `<text x="${i * T + 12}" y="${j * T + 18}" font-family="Press Start 2P" font-size="12" text-anchor="middle" fill="#10101c">???</text>`;
      return;
    }
    const nova = S.novas.includes(r.id);
    s += `<g data-reg="${r.id}" class="${nova ? 'new' : ''}">
      <rect x="${x - 4}" y="${y - 4}" width="56" height="56" fill="none" stroke="${{ revelada: '#f1c40f', desbloqueada: '#f4f0e8', desatualizada: '#ff9f43' }[e]}" stroke-width="3" stroke-dasharray="${e === 'desbloqueada' ? '6 6' : '0'}"/>
      ${sprite(SPR[r.id], x, y, 6)}
      <text x="${x + 24}" y="${y + 74}" font-family="VT323" font-size="20" text-anchor="middle" fill="#f4f0e8" stroke="#10101c" stroke-width="4" paint-order="stroke">${r.nome}${e === 'revelada' ? ' ★' : e === 'desatualizada' ? ' ⟳' : ''}</text></g>`;
  });
  const [hi, hj] = POS[S.exp ? S.exp.regiao : 'cardapio'];
  s += sprite(SPR.heroi, hi * T + 30, hj * T + 6, 3);
  return `<svg viewBox="0 0 ${COLS * T} ${ROWS * T}" shape-rendering="crispEdges">${s}${rotulos.join('')}</svg>`;
}

function barra(n, max, cls = '') { return `<span class="D-bar ${cls}">${Array.from({ length: max }, (_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</span>`; }

function opcoesPixel(d, e) {
  if (d.steps) {
    const rest = d.steps.map((_, k) => k).filter(k => !e.flow.includes(k));
    return `<div>Ordem escolhida:</div>${e.flow.map((k, n) => `<div class="${d.steps[k].fog ? 'D-step-fog' : ''}">&nbsp;${n + 1}. ${esc(d.steps[k].t)}</div>`).join('') || '<div class="D-step-fog">&nbsp;(vazia)</div>'}
      ${e.fase === 'responder' ? rest.map(k => `<button class="D-btn ${d.steps[k].fog ? 'D-step-fog' : ''}" data-step="${k}">${esc(d.steps[k].t)}</button>`).join('')
        + (e.flow.length ? '<button class="D-btn" data-act="limpar">↺ Recomeçar a ordem</button>' : '') : ''}`;
  }
  return d.opts.map((o, k) => {
    let c = 'D-btn'; if (e.sel === k) c += ' sel';
    if (e.fase === 'feedback') { if (k === d.gab) c += ' right'; else if (e.sel === k) c += ' wrong'; }
    return `<button class="${c}" data-opt="${k}" ${e.fase !== 'responder' ? 'disabled' : ''}>${esc(o)}</button>`;
  }).join('');
}

function telaMapaBatalha(tutorial) {
  const p = proxTitulo(S.xp), base = TITULOS.filter(([m]) => S.xp >= m).pop()[0];
  const hud = tutorial ? '' : `<div class="D-win D-hud"><div><button class="D-btn" style="display:inline;width:auto;padding-left:6px" data-act="inicio">☰ MENU</button> <span class="px" style="font-size:12px">${titulo(S.xp)}</span><br>XP ${S.xp} ${barra(Math.round(10 * (S.xp - base) / ((p ? p[0] : S.xp + 1) - base)), 10)} ${p ? '→ ' + p[1] : ''}</div>
    <div>TAVERNA DO SLOP · FULLSTACK<br>MAPA ${barra(Math.round(progresso() / 10), 10)} ${progresso()}%</div></div>`;

  else if (a === 'wiznext') w.passo = Math.min(5, w.passo + 1);
  else if (a === 'wizprev') w.passo = Math.max(1, w.passo - 1);
  else if (a === 'addrepo') w.repos.push('~/trabalho/loja-infra');
  else if (a === 'fecharmodal') S.modal = null;
  else if (a === 'nada') flash('(protótipo)');
  else return;
  render();
});

const VARIANTES = { A: 'Mapa-mundi', B: 'Palco de game show', C: 'Editor (IDE)', D: 'Pixel RPG' };
function render() {
  const v = VARIANTES[S.variant] ? S.variant : 'D';
  document.getElementById('app').innerHTML = { A: VariantA, B: VariantB, C: VariantC, D: VariantD }[v]() + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  document.getElementById('label').textContent = `${v} — ${VARIANTES[v]}`;
}
function setVariant(d) {
  const ks = Object.keys(VARIANTES); S.variant = ks[(ks.indexOf(S.variant) + d + ks.length) % ks.length];
  history.replaceState(null, '', '?variant=' + S.variant); render();
}
document.getElementById('prev').onclick = () => setVariant(-1);
document.getElementById('next').onclick = () => setVariant(1);
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input, textarea, [contenteditable]')) return;
  if (ev.key === 'ArrowLeft') setVariant(-1); if (ev.key === 'ArrowRight') setVariant(1);
});
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-opt],[data-step],[data-act],[data-reg],[data-file]'); if (!el) return;
  const e = S.exp;
  if (el.dataset.reg && !e) iniciarExpedicao(el.dataset.reg);
  else if (el.dataset.file) { S.arquivo = el.dataset.file; render(); }
  else if (el.dataset.opt && e) { e.sel = +el.dataset.opt; render(); }
  else if (el.dataset.step && e) { e.flow.push(+el.dataset.step); render(); }
  else if (el.dataset.act) (({
    responder, proximo, sair,
    limpar: () => { e.flow = []; render(); },
    contestar: () => { e.contestando = true; render(); },
    enviarcont: () => contestar(document.getElementById('arg').value),
  })[el.dataset.act] || (() => {}))();
});
{ const q = new URLSearchParams(location.search);
  if (q.get('tela')) S.tela = q.get('tela');
  if (q.get('passo')) S.wiz.passo = +q.get('passo');
  if (q.get('demo') === 'batalha') { S.tela = 'mapa'; iniciarExpedicao('api'); }
  if (q.get('demo') === 'desatualizada') { S.tela = 'mapa'; S.modal = 'grimorio'; } }
render();
</script>
