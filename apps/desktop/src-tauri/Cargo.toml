[package]
name = "quiz-your-slop"
version = "0.1.0"
description = "Quiz your slop: o Jogo desktop."
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# O sufixo _lib evita colisão com o binário de mesmo nome no Windows.
name = "quiz_your_slop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# canonicalize sem o prefixo \\?\ no Windows (cmd.exe e as CLIs não aceitam esse caminho).
dunce = "1.0.5"
# Só o seletor de pastas, chamado do Rust (escolher_pasta); a janela não recebe permissão dialog:*.
tauri-plugin-dialog = "2.8.3"
# Login no desktop (src/login): HTTP ao site, chaveiro do sistema, navegador e PKCE.
ureq = { version = "3.5.0", features = ["json"] }
keyring = { version = "3.6.3", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
open = "5.4.5"
getrandom = "0.3.4"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
strip = true
