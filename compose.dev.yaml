# Postgres só para desenvolvimento local (o de produção vem com o deploy, spec §11).
# `docker compose -f compose.dev.yaml up -d`; as migrações rodam quando o site sobe.
name: quiz-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
    ports:
      - '5433:5432'
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
